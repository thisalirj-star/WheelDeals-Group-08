{% extends 'base.html' %}

{% block title %}Delete Listing — WheelDeals{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0" style="border-radius: 16px; border-top: 4px solid #dc3545 !important;">
                <div class="card-body p-5 text-center">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                    <h4 class="fw-bold" style="color: #0d1f3c;">Delete this listing?</h4>
                    <p class="text-muted mt-2">
                        You are about to permanently delete
                        <strong style="color: #0d1f3c;">{{ car.title }}</strong>.
                        This cannot be undone.
                    </p>

                    <form method="POST" class="mt-4">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger fw-bold me-2 px-4"
                            style="border-radius: 10px;">
                            <i class="bi bi-trash me-1"></i>Yes, Delete
                        </button>
                        <a href="{% url 'seller_dashboard' %}"
                            class="btn fw-bold px-4"
                            style="border: 2px solid #1a6fc4; color: #1a6fc4; border-radius: 10px;">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
